<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرتغال شاپ | Portugal Shop</title>
    
    <!-- Google Fonts (Vazir/Sans-Serif fallback) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link to our custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-orange"></i> <span>پرتغال شاپ</span>
            </div>
            <div class="nav-actions">
                <button id="login-btn" class="btn-secondary">
                    <i class="fas fa-user"></i> ورود / ثبت‌نام
                </button>
                <button id="cart-btn" class="btn-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="badge">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>به دنیای محصولات خاص خوش آمدید</h1>
            <p>بهترین کیفیت، بهترین قیمت در پرتغال شاپ</p>
            <a href="#product-list" class="btn-primary">شروع خرید</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <section id="product-list-section">
            <h2 class="section-title">محصولات ما</h2>
            <div id="product-list" class="product-grid">
                <!-- Products will be injected here by JavaScript -->
                <div class="loading-spinner">در حال بارگذاری...</div>
            </div>
        </section>
    </main>

    <!-- Cart Drawer (Slides from right) -->
    <div id="cart-overlay" class="overlay"></div>
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h3><i class="fas fa-shopping-basket"></i> سبد خرید شما</h3>
            <button id="close-cart" class="btn-close">&times;</button>
        </div>
        <div id="cart-items" class="cart-items-container">
            <!-- Cart items will be injected here -->
            <p class="empty-msg">سبد خرید شما خالی است.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>جمع کل:</span>
                <span id="total-price">0</span> <small>تومان</small>
            </div>
            <button id="checkout-btn" class="btn-checkout">تایید و ارسال سفارش</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>جميع حقوق برای &copy; پرتغال شاپ محفوظ است.</p>
    </footer>

    <!-- Link to our custom JS -->
    <script src="/static/js/script.js"></script>
</body>
</html>
